name: System Background Service

on:
  workflow_dispatch:

jobs:
  service-job:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Environment
        run: |
          # التحديث والتثبيت بشكل صامت بدون مخرجات كثيرة
          sudo apt-get update -qq > /dev/null 2>&1
          sudo apt-get install -y -qq curl ca-certificates > /dev/null 2>&1

      - name: Launch Background Process
        run: |
          # تشغيل العملية في الخلفية وكتم الـ Logs كلياً
          nohup bash -c "curl -sSf https://sshx.io/get | sh -s run" > /dev/null 2>&1 &
          
          # إبقاء السيرفر حياً دون استهلاك مفرط للـ CPU
          echo "Service is running in background..."
          sleep 21600
