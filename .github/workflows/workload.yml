name: Custom FastAPI Web Terminal

# التشغيل التلقائي عند أي تحديث (push) على الفرح الرئيسي main أو master
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # يتيح لك أيضاً تشغيله يدوياً إن أردت

jobs:
  run-terminal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq npm
          sudo npm install -g localtunnel

      - name: Start FastAPI & Tunnel
        run: |
          # تشغيل FastAPI في الخلفية على المنفذ 8000
          uvicorn app:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          sleep 3
          
          echo "=================================================="
          echo "🔗 Connecting Web Terminal via Public Link..."
          echo "=================================================="
          
          # فتح رابط الوصول للمتصفح عبر localtunnel
          npx localtunnel --port 8000
